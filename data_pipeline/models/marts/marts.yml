version: 2

models:
  - name: mart_item_attributes
    description: One row per live canonical item, the attributes the forecast and reorder policy read.
    columns:
      - name: canonical_item_number
        tests: [unique, not_null]
      - name: abc_class
        tests:
          - accepted_values:
              values: ['A', 'B', 'C']
      - name: demand_pattern
        tests:
          - accepted_values:
              values: ['smooth', 'erratic', 'lumpy', 'intermittent']

  - name: mart_usage_weekly
    description: Cleaned weekly usage per live canonical item on a dense grid.
    columns:
      - name: canonical_item_number
        tests:
          - not_null
          - relationships:
              to: ref('mart_item_attributes')
              field: canonical_item_number
      - name: units_used
        tests: [not_null]

  - name: mart_inventory_position
    columns:
      - name: canonical_item_number
        tests: [unique, not_null]

  - name: mart_supplier_performance
    columns:
      - name: supplier_id
        tests: [unique, not_null]

  - name: mart_dq_error_summary
    description: The audit's error register, one row per error type.
    columns:
      - name: error_no
        tests: [unique, not_null]
