version: 2

# Raw extracts are read directly from CSV through DuckDB. Paths are relative to the
# data_pipeline directory (the dbt working directory).

sources:
  - name: erp
    description: The shop's ERP, one extract per module.
    tables:
      - name: item_master
        meta:
          external_location: "read_csv_auto('../data_source/raw/erp/item_master.csv')"
      - name: supplier_master
        meta:
          external_location: "read_csv_auto('../data_source/raw/erp/supplier_master.csv')"
      - name: bill_of_materials
        meta:
          external_location: "read_csv_auto('../data_source/raw/erp/bill_of_materials.csv')"
      - name: production_orders
        meta:
          external_location: "read_csv_auto('../data_source/raw/erp/production_orders.csv')"
      - name: service_orders
        meta:
          external_location: "read_csv_auto('../data_source/raw/erp/service_orders.csv')"
      - name: purchase_orders
        meta:
          external_location: "read_csv_auto('../data_source/raw/erp/purchase_orders.csv')"
      - name: inventory_transactions
        meta:
          external_location: "read_csv_auto('../data_source/raw/erp/inventory_transactions.csv')"

  - name: wms
    description: Warehouse cycle and annual counts.
    tables:
      - name: cycle_counts
        meta:
          external_location: "read_csv_auto('../data_source/raw/wms/cycle_counts.csv')"

  - name: purchasing
    description: The purchasing manager's own tracking spreadsheet.
    tables:
      - name: buyer_spreadsheet
        meta:
          external_location: "read_csv_auto('../data_source/raw/purchasing/buyer_spreadsheet.csv')"

  - name: remediation
    description: >
      The records the ten-week cleanup left behind: every merge, correction,
      deactivation and recomputed parameter, so each change to the history is auditable.
    tables:
      - name: dead_item_dispositions
        meta:
          external_location: "read_csv_auto('../data_source/raw/remediation/dead_item_dispositions.csv')"
      - name: duplicate_crosswalk
        meta:
          external_location: "read_csv_auto('../data_source/raw/remediation/duplicate_crosswalk.csv')"
      - name: supplier_crosswalk
        meta:
          external_location: "read_csv_auto('../data_source/raw/remediation/supplier_crosswalk.csv')"
      - name: uom_conversions
        meta:
          external_location: "read_csv_auto('../data_source/raw/remediation/uom_conversions.csv')"
      - name: lead_time_computation
        meta:
          external_location: "read_csv_auto('../data_source/raw/remediation/lead_time_computation.csv')"
      - name: parameter_recommendations
        meta:
          external_location: "read_csv_auto('../data_source/raw/remediation/parameter_recommendations.csv')"
      - name: chronic_adjustment_list
        meta:
          external_location: "read_csv_auto('../data_source/raw/remediation/chronic_adjustment_list.csv')"
      - name: bom_change_log
        meta:
          external_location: "read_csv_auto('../data_source/raw/remediation/bom_change_log.csv')"
      - name: posting_corrections
        meta:
          external_location: "read_csv_auto('../data_source/raw/remediation/posting_corrections.csv')"
      - name: open_document_closures
        meta:
          external_location: "read_csv_auto('../data_source/raw/remediation/open_document_closures.csv')"
      - name: free_text_attribution
        meta:
          external_location: "read_csv_auto('../data_source/raw/remediation/free_text_attribution.csv')"

  - name: truth
    description: >
      The generator's record of what it planted and the true demand behind the recorded
      history, flattened by data_source/generate/export_truth.py. A real warehouse would
      not have these; here they stand in for findings the business confirmed and give
      the forecast a true-demand series to be scored against.
    tables:
      - name: true_direct_demand
        meta:
          external_location: "read_csv_auto('../data_source/truth/true_direct_demand.csv')"
      - name: true_backflush
        meta:
          external_location: "read_csv_auto('../data_source/truth/true_backflush.csv')"
      - name: duplicate_clusters
        meta:
          external_location: "read_csv_auto('../data_source/truth/duplicate_clusters.csv')"
      - name: abc_by_item
        meta:
          external_location: "read_csv_auto('../data_source/truth/abc_by_item.csv')"
      - name: unrecorded_usage
        meta:
          external_location: "read_csv_auto('../data_source/truth/unrecorded_usage.csv')"
      - name: uom_mismatch_items
        meta:
          external_location: "read_csv_auto('../data_source/truth/uom_mismatch_items.csv')"
      - name: batched_receipts
        meta:
          external_location: "read_csv_auto('../data_source/truth/batched_receipts.csv')"
