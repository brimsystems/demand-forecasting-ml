[project]
name = "mfg-inventory-forecast"
version = "0.1.0"
description = "Inventory demand forecasting and ERP data quality for an industrial equipment manufacturer."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=14.0",
    "scipy>=1.11",
    "faker>=20.0",
    "duckdb>=0.10",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "optuna>=3.0",
    "shap>=0.45",
    "matplotlib>=3.8",
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["data_source"]
